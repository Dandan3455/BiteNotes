<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BiteNotes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-name">BiteNotes</div>
    <div class="date-nav">
      <button class="nav-btn" id="prevDayBtn" type="button" aria-label="前一天">‹</button>
      <button class="today-btn" id="todayBtn" type="button">今日 ▾</button>
      <button class="nav-btn" id="nextDayBtn" type="button" aria-label="后一天">›</button>
    </div>
    <input class="date-input" type="date" id="datePicker" />
  </header>

  <main>
    <section class="card budget-card">
      <div class="section-title">
        <div>
          <button class="day-badge" id="dayTypeBadge" type="button">选择你的目标</button>
        </div>
      </div>

      <div class="empty-target-message hidden" id="emptyTargetMessage">
        <strong>先选择今天的摄入目标</strong>
        <p>设置目标后，这里会显示今日还可摄入的热量和三大营养素。</p>
      </div>

      <div class="budget-content" id="budgetContent">
        <div class="budget-main">
          <div>
            <span>今日还可摄入</span>
            <strong><b id="remainingCalories">1800</b><small>kcal</small></strong>
            <p><b id="eatenCalories">0</b> / <b id="targetCalories">1800</b> kcal 已使用</p>
          </div>
          <div class="budget-token">
            <span>剩余比例</span>
            <strong id="remainingPercent">100%</strong>
          </div>
        </div>
        <div class="budget-bar">
          <span id="caloriesFill"></span>
        </div>

        <div class="macro-budget-grid">
          <div class="macro-budget">
            <span>蛋白质</span>
            <strong>还可摄入 <b id="remainingProtein">--</b>g</strong>
            <small><b id="eatenProtein">--</b> / <b id="targetProtein">--</b>g</small>
            <i><em id="proteinFill"></em></i>
          </div>
          <div class="macro-budget">
            <span>碳水</span>
            <strong>还可摄入 <b id="remainingCarbs">--</b>g</strong>
            <small><b id="eatenCarbs">--</b> / <b id="targetCarbs">--</b>g</small>
            <i><em id="carbsFill"></em></i>
          </div>
          <div class="macro-budget">
            <span>脂肪</span>
            <strong>还可摄入 <b id="remainingFat">--</b>g</strong>
            <small><b id="eatenFat">--</b> / <b id="targetFat">--</b>g</small>
            <i><em id="fatFill"></em></i>
          </div>
        </div>
      </div>
    </section>

    <section class="meal-list" id="mealList"></section>
  </main>

  <script type="module">
  import {
    dayTemplates,
    formatDateLabel,
    getDayMeta,
    getRecordMeal,
    getRecords,
    mealTarget,
    meals,
    recordTotals,
    rounded,
    shiftDate,
    targetTotals,
    todayString,
  } from './goalService.js';

  const dateInput = document.getElementById('datePicker');
  const todayBtn = document.getElementById('todayBtn');
  const prevDayBtn = document.getElementById('prevDayBtn');
  const nextDayBtn = document.getElementById('nextDayBtn');
  const dayTypeBadge = document.getElementById('dayTypeBadge');
  const budgetContent = document.getElementById('budgetContent');
  const emptyTargetMessage = document.getElementById('emptyTargetMessage');
  const mealList = document.getElementById('mealList');
  const summaryEls = {
    calories: {
      eaten: document.getElementById('eatenCalories'),
      target: document.getElementById('targetCalories'),
      remaining: document.getElementById('remainingCalories'),
      fill: document.getElementById('caloriesFill'),
    },
    carbs: {
      eaten: document.getElementById('eatenCarbs'),
      target: document.getElementById('targetCarbs'),
      remaining: document.getElementById('remainingCarbs'),
      fill: document.getElementById('carbsFill'),
    },
    protein: {
      eaten: document.getElementById('eatenProtein'),
      target: document.getElementById('targetProtein'),
      remaining: document.getElementById('remainingProtein'),
      fill: document.getElementById('proteinFill'),
    },
    fat: {
      eaten: document.getElementById('eatenFat'),
      target: document.getElementById('targetFat'),
      remaining: document.getElementById('remainingFat'),
      fill: document.getElementById('fatFill'),
    },
  };
  const remainingPercent = document.getElementById('remainingPercent');

  let currentMeta = {};
  let currentRecords = [];

  function goTo(page) {
    window.location.href = `${page}?date=${encodeURIComponent(dateInput.value)}`;
  }

  function renderSummary() {
    const totals = recordTotals(currentRecords);
    const targets = targetTotals(currentMeta);
    dayTypeBadge.textContent = currentMeta.targetConfigured
      ? (dayTemplates[currentMeta.dayType]?.label || '训练日')
      : '选择你的目标';
    todayBtn.textContent = formatDateLabel(dateInput.value);
    budgetContent.classList.toggle('hidden', !currentMeta.targetConfigured);
    emptyTargetMessage.classList.toggle('hidden', currentMeta.targetConfigured);

    if (!currentMeta.targetConfigured) {
      return;
    }

    Object.entries(summaryEls).forEach(([key, els]) => {
      const eaten = rounded(totals[key]);
      const target = rounded(targets[key]);
      const percent = target > 0 ? Math.min((eaten / target) * 100, 100) : 0;
      const remaining = Math.max(target - eaten, 0);
      els.eaten.textContent = eaten;
      els.target.textContent = target;
      els.remaining.textContent = remaining;
      els.fill.style.width = `${percent}%`;
    });
    const calorieTarget = rounded(targets.calories);
    const calorieEaten = rounded(totals.calories);
    remainingPercent.textContent = calorieTarget > 0
      ? `${Math.max(100 - Math.round((calorieEaten / calorieTarget) * 100), 0)}%`
      : '0%';
  }

  function renderMeals() {
    mealList.innerHTML = meals.map(meal => {
      const records = currentRecords.filter(rec => getRecordMeal(rec) === meal.id);
      const totals = recordTotals(records);
      const mealSummary = currentMeta.targetConfigured
        ? (records.length ? `${records.length} 个食物 · 已吃 ${rounded(totals.calories)} kcal` : '请添加食物')
        : (records.length ? `${records.length} 个食物` : '请添加食物');
      const mealDetail = currentMeta.targetConfigured
        ? (() => {
            const target = mealTarget(currentMeta, meal.id);
            const remaining = Math.max(rounded(target.calories) - rounded(totals.calories), 0);
            return `
              <em>本餐还可摄入 ${remaining} kcal · 建议 ${rounded(target.calories)} kcal</em>
              <em>P ${rounded(target.protein)}g / C ${rounded(target.carbs)}g / F ${rounded(target.fat)}g</em>
            `;
          })()
        : '<em>先设置目标后查看本餐建议</em>';

      return `
        <article class="card meal-card">
          <button class="meal-head" type="button" data-meal="${meal.id}">
            <span>
              <strong>${meal.title}</strong>
              <small>${mealSummary}</small>
              ${mealDetail}
            </span>
            <b>›</b>
          </button>
        </article>
      `;
    }).join('');
  }

  function loadDay(date) {
    dateInput.value = date;
    currentMeta = getDayMeta(date);
    currentRecords = getRecords(date);
    renderSummary();
    renderMeals();
  }

  dayTypeBadge.addEventListener('click', () => goTo('goal.html'));
  mealList.addEventListener('click', event => {
    const button = event.target.closest('[data-meal]');
    if (button) {
      window.location.href = `meal.html?date=${encodeURIComponent(dateInput.value)}&meal=${encodeURIComponent(button.dataset.meal)}`;
    }
  });
  todayBtn.addEventListener('click', () => {
    dateInput.showPicker?.();
    dateInput.focus();
  });
  dateInput.addEventListener('change', () => loadDay(dateInput.value));
  prevDayBtn.addEventListener('click', () => loadDay(shiftDate(dateInput.value, -1)));
  nextDayBtn.addEventListener('click', () => loadDay(shiftDate(dateInput.value, 1)));
  window.addEventListener('load', () => {
    const params = new URLSearchParams(window.location.search);
    loadDay(params.get('date') || todayString());
  });
  </script>
</body>
</html>
