<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设置目标 - BiteNotes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="page-top">
    <button class="back-btn" id="backBtn" type="button">‹</button>
    <h1>设置营养目标</h1>
    <span></span>
  </header>

  <main>
    <section class="card settings-card">
      <div class="form-row">
        <label for="dayType">今日类型</label>
        <select id="dayType">
          <option value="training">训练日</option>
          <option value="rest">休息日</option>
        </select>
      </div>

      <div class="form-row">
        <label for="targetMode">目标设置方式</label>
        <select id="targetMode">
          <option value="ratio">方式 A：总热量 + 比例</option>
          <option value="grams">方式 B：手动输入克数</option>
        </select>
      </div>

      <div class="target-mode-panel" id="ratioPanel">
        <div class="form-row">
          <label for="goalCalories">Daily calories (kcal)</label>
          <input type="number" id="goalCalories" min="0" step="10" />
        </div>
        <div class="macro-grid">
          <label>Protein %
            <input type="number" id="proteinPercent" min="0" max="100" step="1" />
          </label>
          <label>Carbs %
            <input type="number" id="carbsPercent" min="0" max="100" step="1" />
          </label>
          <label>Fat %
            <input type="number" id="fatPercent" min="0" max="100" step="1" />
          </label>
        </div>
        <p class="ratio-status" id="macroRatioStatus">供能比例待设置</p>
      </div>

      <div class="target-mode-panel hidden" id="gramsPanel">
        <div class="macro-grid">
          <label>Protein g
            <input type="number" id="proteinGrams" min="0" step="1" />
          </label>
          <label>Carbs g
            <input type="number" id="carbsGrams" min="0" step="1" />
          </label>
          <label>Fat g
            <input type="number" id="fatGrams" min="0" step="1" />
          </label>
        </div>
        <p class="hint">总热量会按 Protein × 4 + Carbs × 4 + Fat × 9 自动计算。</p>
      </div>

      <div class="summary-strip" id="targetPreview"></div>

      <div class="meal-split">
        <p class="subhead">每餐分配</p>
        <div class="macro-grid meal-ratio-grid">
          <label>第 1 餐 %
            <input type="number" class="meal-ratio-input" data-meal="meal1" min="0" max="100" step="1" />
          </label>
          <label>第 2 餐 %
            <input type="number" class="meal-ratio-input" data-meal="meal2" min="0" max="100" step="1" />
          </label>
          <label>第 3 餐 %
            <input type="number" class="meal-ratio-input" data-meal="meal3" min="0" max="100" step="1" />
          </label>
          <label>加餐 %
            <input type="number" class="meal-ratio-input" data-meal="snack" min="0" max="100" step="1" />
          </label>
        </div>
        <p class="ratio-status" id="mealRatioStatus">每餐分配待设置</p>
      </div>

      <button class="primary-btn" id="saveBtn" type="button">保存目标</button>
    </section>
  </main>

  <script type="module">
  import {
    getGoalProfile,
    getInitialGoalMeta,
    hasValue,
    normalizeMeta,
    recalculateTargets,
    rounded,
    saveDayMeta,
    toNumber,
  } from './goalService.js';

  const params = new URLSearchParams(window.location.search);
  const date = params.get('date') || new Date().toISOString().slice(0, 10);
  let currentMeta = getInitialGoalMeta(date);

  const dayType = document.getElementById('dayType');
  const targetMode = document.getElementById('targetMode');
  const ratioPanel = document.getElementById('ratioPanel');
  const gramsPanel = document.getElementById('gramsPanel');
  const targetPreview = document.getElementById('targetPreview');
  const macroRatioStatus = document.getElementById('macroRatioStatus');
  const mealRatioStatus = document.getElementById('mealRatioStatus');
  const inputs = {
    goalCalories: document.getElementById('goalCalories'),
    proteinPercent: document.getElementById('proteinPercent'),
    carbsPercent: document.getElementById('carbsPercent'),
    fatPercent: document.getElementById('fatPercent'),
    proteinGrams: document.getElementById('proteinGrams'),
    carbsGrams: document.getElementById('carbsGrams'),
    fatGrams: document.getElementById('fatGrams'),
  };

  function backHome() {
    window.location.href = `index.html?date=${encodeURIComponent(date)}`;
  }

  function macroRatioInputs() {
    return [inputs.proteinPercent, inputs.carbsPercent, inputs.fatPercent];
  }

  function macroKeyFromInput(input) {
    return input.id.replace('Percent', '');
  }

  function macroRatioTotal() {
    return Object.values(currentMeta.macroRatio).reduce((sum, value) => sum + toNumber(value), 0);
  }

  function mealRatioInputs() {
    return Array.from(document.querySelectorAll('.meal-ratio-input'));
  }

  function mealRatioTotal() {
    return Object.values(currentMeta.mealRatio).reduce((sum, value) => sum + toNumber(value), 0);
  }

  function setRatioStatus(element, label, total) {
    const remaining = Math.max(100 - total, 0);
    element.textContent = `${label}已分配 ${rounded(total)}%，剩余 ${rounded(remaining)}%`;
    element.classList.toggle('complete', rounded(total) === 100);
    element.classList.toggle('warning', rounded(total) !== 100);
  }

  function updateInputMaxes(inputList) {
    inputList.forEach(input => {
      const otherTotal = inputList
        .filter(other => other !== input)
        .reduce((sum, other) => sum + toNumber(other.value), 0);
      input.max = Math.max(100 - otherTotal, 0);
    });
  }

  function updateMacroRatioStatus() {
    setRatioStatus(macroRatioStatus, '供能比例', macroRatioTotal());
    updateInputMaxes(macroRatioInputs());
  }

  function updateMealRatioStatus() {
    setRatioStatus(mealRatioStatus, '', mealRatioTotal());
    updateInputMaxes(mealRatioInputs());
  }

  function updateTargetPreview() {
    targetPreview.textContent = hasValue(currentMeta.targetCalories)
      ? `${rounded(currentMeta.targetCalories)} kcal · P ${rounded(currentMeta.macroGrams.protein)}g / C ${rounded(currentMeta.macroGrams.carbs)}g / F ${rounded(currentMeta.macroGrams.fat)}g`
      : '待设置：请填写热量和三大营养素';
  }

  function syncForm() {
    currentMeta = recalculateTargets(currentMeta);
    dayType.value = currentMeta.dayType;
    targetMode.value = currentMeta.targetMode;
    inputs.goalCalories.value = currentMeta.targetCalories;
    inputs.proteinPercent.value = currentMeta.macroRatio.protein;
    inputs.carbsPercent.value = currentMeta.macroRatio.carbs;
    inputs.fatPercent.value = currentMeta.macroRatio.fat;
    inputs.proteinGrams.value = currentMeta.macroGrams.protein;
    inputs.carbsGrams.value = currentMeta.macroGrams.carbs;
    inputs.fatGrams.value = currentMeta.macroGrams.fat;
    mealRatioInputs().forEach(input => {
      input.value = currentMeta.mealRatio[input.dataset.meal] ?? '';
    });
    ratioPanel.classList.toggle('hidden', currentMeta.targetMode !== 'ratio');
    gramsPanel.classList.toggle('hidden', currentMeta.targetMode !== 'grams');
    updateTargetPreview();
    updateMacroRatioStatus();
    updateMealRatioStatus();
  }

  function clampInput(input, inputList) {
    const otherTotal = inputList
      .filter(other => other !== input)
      .reduce((sum, other) => sum + toNumber(other.value), 0);
    const maxValue = Math.max(100 - otherTotal, 0);
    const nextValue = Math.min(Math.max(toNumber(input.value), 0), maxValue);
    input.value = nextValue;
    return nextValue;
  }

  dayType.addEventListener('change', () => {
    currentMeta = normalizeMeta(getGoalProfile(dayType.value) || { dayType: dayType.value });
    syncForm();
  });

  targetMode.addEventListener('change', () => {
    currentMeta.targetMode = targetMode.value;
    syncForm();
  });

  inputs.goalCalories.addEventListener('input', () => {
    currentMeta.targetCalories = toNumber(inputs.goalCalories.value);
    syncForm();
  });

  macroRatioInputs().forEach(input => {
    input.addEventListener('input', () => {
      currentMeta.macroRatio[macroKeyFromInput(input)] = clampInput(input, macroRatioInputs());
      currentMeta = recalculateTargets(currentMeta);
      updateTargetPreview();
      updateMacroRatioStatus();
    });
  });

  ['proteinGrams', 'carbsGrams', 'fatGrams'].forEach(id => {
    inputs[id].addEventListener('input', () => {
      currentMeta.macroGrams[id.replace('Grams', '')] = toNumber(inputs[id].value);
      syncForm();
    });
  });

  mealRatioInputs().forEach(input => {
    input.addEventListener('input', () => {
      currentMeta.mealRatio[input.dataset.meal] = clampInput(input, mealRatioInputs());
      updateMealRatioStatus();
    });
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    if (!hasValue(currentMeta.targetCalories) || toNumber(currentMeta.targetCalories) <= 0) {
      alert('请先填写今日总热量或三大营养素克数');
      return;
    }
    if (currentMeta.targetMode === 'ratio' && rounded(macroRatioTotal()) !== 100) {
      alert('三大营养素供能比例需要合计 100%');
      return;
    }
    if (rounded(mealRatioTotal()) !== 100) {
      alert('每餐分配需要合计 100%');
      return;
    }
    currentMeta = saveDayMeta(date, currentMeta);
    backHome();
  });

  document.getElementById('backBtn').addEventListener('click', backHome);
  window.addEventListener('load', syncForm);
  </script>
</body>
</html>
